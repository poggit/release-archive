<a id="user-content-crashlogger" class="anchor" href="#crashlogger" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>CrashLogger</h1>

<a id="user-content-requirements" class="anchor" href="#requirements" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a><strong>Requirements:</strong>
</h3>
<ul>
<li>A webhook url from discord</li>
<li>An internet connection</li>
</ul>
