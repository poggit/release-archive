<h1>
<a id="user-content-godmode" class="anchor" href="#godmode" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Godmode</h1>
<p>Pocketmine-MP API 3 Godmode is a Plugin which allows players to put themselves in Godmode.</p>
<p>Players in Godmode are protected and invincible. Settings for the Godmode can be made in the Configuration file.</p>
<p><a href="https://user-images.githubusercontent.com/45903049/128408907-a0491d84-1b70-47a1-b029-75910073c3c6.png" target="_blank" rel="nofollow"><img src="https://user-images.githubusercontent.com/45903049/128408907-a0491d84-1b70-47a1-b029-75910073c3c6.png" alt="weapons" style="max-width:100%;"></a></p>
<h3>
<a id="user-content--how-to-use-it-" class="anchor" href="#-how-to-use-it-" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a> How to use it? </h3>
<p>Command: god / godmode <br>
Permission: godmode.use<br></p>
