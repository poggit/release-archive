<h1>
<a id="user-content-novpn" class="anchor" href="#novpn" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>NoVPN</h1>
<p>A PocketMine-MP plugin that disallows players from joining your server through VPNs.<br>
<strong>NOTE:</strong> You will need to create an account on <a href="https://antivpn.cosmicpe.me/client" rel="nofollow">CosmicPE Anti-VPN</a> and paste your API key in <code>config.yml</code> (<a href="https://github.com/Cosmoverse/NoVPN/blob/master/resources/config.yml#L4">in the <code>api-key</code> field</a>) before using this plugin.</p>
