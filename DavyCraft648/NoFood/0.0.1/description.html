<h1>
<a id="user-content--nofood" class="anchor" href="#-nofood" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a><a href="https://github.com/DavyCraft648/NoFood/blob/main/icon.png" target="_blank" rel="noopener noreferrer"><img src="https://github.com/DavyCraft648/NoFood/raw/main/icon.png" height="64" width="64" style="max-width:100%;"></a> NoFood</h1>
<p>Don't eat! You are fasting!</p>
<p>This plugin will <strong>forbid</strong> players to eat</p>
<h3>
<a id="user-content-features" class="anchor" href="#features" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Features</h3>
<ul>
<li>No hungry feature</li>
<li>Per-world support</li>
<li>Set what food can be eaten</li>
</ul>
<h3>
<a id="user-content-permission" class="anchor" href="#permission" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Permission</h3>
<ul>
<li>nofood.bypass - Allow the player to eat - default: false</li>
</ul>
