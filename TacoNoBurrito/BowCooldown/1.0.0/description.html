<h1>
<a id="user-content-bowcooldown" class="anchor" href="#bowcooldown" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>BowCooldown</h1>
<p>A simple bow cooldown plugin, limit your players from spamming arrows</p>
<h1>
<a id="user-content-config" class="anchor" href="#config" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Config</h1>
<pre><code># The cool down length
cd: "1.0"

# The message sent when they try to shoot
# an arrow whilst on cool down
message: "You are still on bow cd: {time}"

# Whether it sends a popup or message
popup: false```
</code></pre>
