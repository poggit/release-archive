<h1>
<a id="user-content-compassxyz" class="anchor" href="#compassxyz" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>CompassXYZ</h1>
<p>Show Player Coordinates.</p>
<p><a href="https://github.com/jhelom/CompassXYZ-plugin-pocketmine/blob/develop/assets/xyz.png" target="_blank"><img src="https://github.com/jhelom/CompassXYZ-plugin-pocketmine/raw/develop/assets/xyz.png" alt="console" style="max-width:100%;"></a></p>
<h1>
<a id="user-content-commands" class="anchor" href="#commands" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Commands</h1>
<pre><code>/xyz [on|off]
</code></pre>
<h2>
<a id="user-content-show-coordinates" class="anchor" href="#show-coordinates" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Show Coordinates</h2>
<p>Hold compass, or "/xyz on" command.</p>
<h2>
<a id="user-content-hide-coordinates" class="anchor" href="#hide-coordinates" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Hide Coordinates</h2>
<p>Remove the compass from the hand, or "/xyz off" command.</p>
