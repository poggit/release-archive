<h1>
<a id="user-content-armorvalue" class="anchor" href="#armorvalue" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>ArmorValue</h1>
<p>It is a simple plugin to change the defense and durability of vanilla armor in minecraft.
This plugin also supports the visual fix of the durability bar.</p>
<h2>
<a id="user-content-how-to-use" class="anchor" href="#how-to-use" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>How to use</h2>
<p>You just have to setup the new durability and the new defense into the config.yml.</p>
