<h1>
<a id="user-content-errorlogger" class="anchor" href="#errorlogger" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>ErrorLogger</h1>
<p>Simple plugin that logs internal server errrors</p>
<h2>
<a id="user-content-commands" class="anchor" href="#commands" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Commands:</h2>
<ul>
<li>/err list : Shows all the logged errors</li>
<li>/err show : Shows information about error</li>
<li>/err save : Saves all the logged errors to disk</li>
<li>/err remove : Marks error as fixed</li>
<li>/err cause : Causes test error</li>
</ul>
