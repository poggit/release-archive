<p>Show a customized message when a player is kicked because of an <strong>internal server error</strong>(caused by the server or plugins).</p>
<p>Usage:</p>
<ol>
<li>Install the plugin.</li>
<li>Edit config.yml located in plugin_data/CustomErrorMessage to change the message.</li>
<li>Reload/Restart your server.</li>
</ol>
