<h1>
<a id="user-content-description" class="anchor" href="#description" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Description</h1>
<p>Allows you to customise the join &amp; leave messages for specific PurePerms groups.</p>
<h1>
<a id="user-content-usage" class="anchor" href="#usage" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Usage</h1>
<ul>
<li>Install the plugin by putting the .phar file into your plugins folder</li>
<li>Edit the config.yml file of the plugin to set messages per group, an example is provided.</li>
</ul>
