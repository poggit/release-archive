<p>SimpleReplies is a plugin which adds a command to easily reply to your last received message.</p>
<h1>
<a id="user-content-features" class="anchor" href="#features" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Features</h1>
<ul>
<li>Adds the command: /reply &lt;message: string&gt;</li>
</ul>
