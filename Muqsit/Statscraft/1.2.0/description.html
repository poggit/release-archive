<h1>
<a id="user-content-statscraft" class="anchor" href="#statscraft" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Statscraft</h1>
<p>PocketMine-MP plugin that integrates your server with <a href="https://www.statscraft.net" rel="nofollow">Statscraft</a>.</p>
<p>Statscraft is an analytics website that keeps track of your server status and players. Use <code>/statscraft verify &lt;secret&gt;</code> to integrate statscraft with your PocketMine-MP server.</p>
