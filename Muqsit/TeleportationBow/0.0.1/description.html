<h1>
<a id="user-content-teleportation-bow" class="anchor" href="#teleportation-bow" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>Teleportation Bow</h1>
<p>Teleportation bows are essentially a lobby item, yet another means of transport for huge lobbies. A teleportation bow teleports a player wherever the arrow fired from the bow lands. This does not conflict with the behaviour of vanilla bows.</p>
