<h1>
<a id="user-content-taptoarmor" class="anchor" href="#taptoarmor" aria-hidden="true"><span aria-hidden="true" class="octicon octicon-link"></span></a>TapToArmor</h1>
<p>This plugin allows you to wear armor just like a vanilla world.</p>
<p>All you need to do is right-click/hold the screen and it will equip the piece of armor you're holding. If the slot is alerady occupied then the items will be swapped.</p>
